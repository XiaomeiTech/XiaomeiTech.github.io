name: Deploy VitePress site to Pages

'on':
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Debug workspace before build
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          ls -la
          ls -la docs
          ls -la markdown
          sed -n '1,40p' docs/.vitepress/config.mts

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Upload site for server deploy
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-tencent:
    needs: build
    runs-on: ubuntu-latest
    env:
      TENCENT_HOST: ${{ secrets.TENCENT_CLOUD_IP }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist

      - name: Deploy site to Tencent Cloud
        if: ${{ env.TENCENT_HOST != '' }}
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_CLOUD_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.TENCENT_CLOUD_IP }}
          REMOTE_USER: ${{ secrets.TENCENT_CLOUD_USER }}
          REMOTE_PORT: ${{ secrets.TENCENT_CLOUD_SSH_PORT || '22' }}
          TARGET: ${{ secrets.TENCENT_CLOUD_TARGET }}
          SOURCE: "site-dist/"
          ARGS: "-avz --delete"
