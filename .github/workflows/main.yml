name: Test Tencent Cloud SSH Connection

on:
  workflow_dispatch:   # 手动触发，也可以在 push 时触发，但建议手动

jobs:
  network-diagnose:
    runs-on: ubuntu-latest
    env:
      TENCENT_HOST: ${{ secrets.TENCENT_CLOUD_IP }}
      TENCENT_USER: ${{ secrets.TENCENT_CLOUD_USER }}
      TENCENT_PORT_RAW: ${{ secrets.TENCENT_CLOUD_SSH_PORT }}
      SSH_PRIVKEY: ${{ secrets.TENCENT_CLOUD_SSH_PRIVATE_KEY }}

    steps:
      - name: Check required secrets
        run: |
          MISSING=0
          if [[ -z "${{ env.TENCENT_HOST }}" ]]; then echo "⚠️ Missing TENCENT_CLOUD_IP"; MISSING=1; fi
          if [[ -z "${{ env.TENCENT_USER }}" ]]; then echo "⚠️ Missing TENCENT_CLOUD_USER"; MISSING=1; fi
          if [[ -z "${{ env.SSH_PRIVKEY }}" ]]; then echo "⚠️ Missing SSH_PRIVKEY"; MISSING=1; fi
          if [[ $MISSING -eq 1 ]]; then exit 1; fi

      - name: Network & SSH Diagnostics
        run: |
          if [[ -z "${{ env.TENCENT_PORT_RAW }}" ]]; then
            TENCENT_PORT=22
          else
            TENCENT_PORT=${{ env.TENCENT_PORT_RAW }}
          fi

          HOST="${{ env.TENCENT_HOST }}"
          USER="${{ env.TENCENT_USER }}"

          echo "═══════════════════════════════════════════════════════"
          echo "🔍 Tencent Cloud Network Diagnostics"
          echo "   Target Host: $HOST"
          echo "   Target Port: $TENCENT_PORT"
          echo "   Target User: $USER"
          echo "═══════════════════════════════════════════════════════"

          # 1. 运行器公网 IP
          echo "🌐 Runner Public IP:"
          curl -s ifconfig.me || curl -s icanhazip.com || echo "  (failed)"
          echo ""

          # 2. DNS 解析
          echo "🔎 DNS Resolution:"
          dig +short "$HOST" || nslookup "$HOST" || echo "  failed"
          echo ""

          # 3. Ping
          echo "📡 Ping test:"
          ping -c 4 -W 2 "$HOST" || echo "  Ping failed"
          echo ""

          # 4. TCP 端口检测
          echo "🔌 TCP Port $TENCENT_PORT:"
          if timeout 5 bash -c "echo >/dev/tcp/$HOST/$TENCENT_PORT" 2>/dev/null; then
            echo "  ✅ /dev/tcp: SUCCESS"
          else
            echo "  ❌ /dev/tcp: FAILED"
          fi
          # 用 nc 再试
          if command -v nc &> /dev/null; then
            nc -zv -w 5 "$HOST" "$TENCENT_PORT" 2>&1 || echo "  ❌ nc: FAILED"
          fi
          echo ""

          # 5. SSH 握手（详细）
          echo "🔑 SSH handshake (verbose):"
          ssh -v -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p "$TENCENT_PORT" "$USER@$HOST" exit 2>&1 || {
            EXIT_CODE=$?
            if [[ $EXIT_CODE -eq 255 ]]; then
              echo "  ❌ Connection failed (network/timeout/refused)"
            else
              echo "  ✅ SSH handshake established (auth may fail, but network is OK)"
            fi
          }
