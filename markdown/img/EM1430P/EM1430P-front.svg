<svg xmlns="http://www.w3.org/2000/svg" width="332" height="730" viewBox="0 0 332 730" role="img" aria-labelledby="title desc">
  <title id="title">EM1430P 正面面板</title>
  <desc id="desc">面板印字 EM1430，上方为 0.0 至 0.7 和 1.0 至 1.7，下方为 2.0 至 2.7 和 3.0 至 3.7。中间白色标志上方的 PWR/SYS 是 RUN 灯，标志下方的 ERROR 是 ERR 灯。底部电源端子左侧 24V，右侧 0V。</desc>
  <defs>
    <linearGradient id="housing">
      <stop stop-color="#85949d"/>
      <stop offset=".15" stop-color="#b7c1c7"/>
      <stop offset=".77" stop-color="#8b9aa3"/>
      <stop offset="1" stop-color="#637782"/>
    </linearGradient>
    <linearGradient id="face" x2=".7" y2="1">
      <stop stop-color="#474a4f"/>
      <stop offset="1" stop-color="#35383c"/>
    </linearGradient>
    <linearGradient id="socket" x2="0" y2="1">
      <stop stop-color="#102812"/>
      <stop offset=".68" stop-color="#20381b"/>
      <stop offset="1" stop-color="#31482b"/>
    </linearGradient>
    <linearGradient id="contact" x2="0" y2="1">
      <stop stop-color="#daddb4"/>
      <stop offset=".55" stop-color="#89966a"/>
      <stop offset="1" stop-color="#52654a"/>
    </linearGradient>
    <g id="port">
      <path d="M3 2H26L33 7V16L28 21H4L1 17V6Z" fill="url(#socket)" stroke="#47663d"/>
      <path d="M5 5H25M4 8V17" fill="none" stroke="#86ab61" stroke-opacity=".65"/>
      <circle cx="15" cy="13" r="3.4" fill="#152416"/>
      <path d="M13 13H17" stroke="url(#contact)" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="terminal-row">
      <use href="#port"/>
      <use href="#port" x="35"/>
    </g>
    <g id="channel-pair" fill="#272d30" stroke="#626d70">
      <rect x="48" y="10" width="8" height="9" rx="1"/>
      <rect x="151" y="10" width="8" height="9" rx="1"/>
    </g>
    <style>
      text { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .imprint { fill: #f7f8f9; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .label { font-size: 17px; font-weight: 750; }
      .detail { font-size: 14px; fill: #748390; }
      .leader { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) { .detail { fill: #a6b4bf; } }
    </style>
  </defs>

  <!-- Enclosure and mounting tabs, sized from the front-facing reference photo. -->
  <path d="M4 4H37V31H195V699H34V727H3V708L25 648V113L4 38Z" fill="url(#housing)" stroke="#57666d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M10 14H26V109L10 35Z" fill="#101214"/>
  <path d="M10 718V709L26 651V718Z" fill="#101214"/>
  <path d="M35 50Q35 34 49 33H193M31 648V105M38 695H191" fill="none" stroke="#d3dadd" stroke-opacity=".75" stroke-width="2"/>
  <path d="M113 32V55M111 670V698" fill="none" stroke="#687780" stroke-width="1.6"/>
  <path d="M174 68H194V693H174Z" fill="#687b86" opacity=".42"/>
  <path d="M178 78H195M178 96H195M178 114H195M178 132H195M178 150H195M178 168H195M178 186H195M178 204H195M178 222H195" stroke="#29333b" stroke-width="8"/>

