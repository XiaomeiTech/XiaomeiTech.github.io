<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title description">
  <title id="title">PLD-V88-P48-400 电机与编码器面接口图</title>
  <desc id="description">透明背景。八位拨码依次为地址码 1、2、4、8、16、32，以及 RE、TR。编码器上排为 V+、FA−、FB−、FC−，下排为 GND、FA+、FB+、FC+。电机接口上排为 OT、V+、GND，下排为 U、V、W。</desc>
  <defs>
    <linearGradient id="aluminum" x2="0" y2="1"><stop stop-color="#f5f6f7"/><stop offset=".42" stop-color="#e4e7e9"/><stop offset="1" stop-color="#cbd0d4"/></linearGradient>
    <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#afb6bc"/></linearGradient>
    <linearGradient id="housing" x2="1" y2="0"><stop stop-color="#e3e8e8"/><stop offset=".5" stop-color="#c3cfce"/><stop offset="1" stop-color="#99aaa9"/></linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M2 3H4M11 7H13M6 14H8M15 16H17" stroke="#64727b" stroke-opacity=".14" stroke-width="1"/><path d="M4 5H6M13 9H15M8 16H10" stroke="#fff" stroke-opacity=".65" stroke-width="1"/><circle cx="8" cy="4" r=".6" fill="#6f7b83" fill-opacity=".13"/></pattern>
    <linearGradient id="socket-well" x2="0" y2="1"><stop stop-color="#394b4e"/><stop offset="1" stop-color="#788c89"/></linearGradient>
    <linearGradient id="metal-pin" x2="1" y2="1"><stop stop-color="#f1f0d9"/><stop offset=".55" stop-color="#a8aaa2"/><stop offset="1" stop-color="#535f61"/></linearGradient>
    <g id="screw"><circle r="24" fill="#b7bec3" stroke="#30383e" stroke-width="2.5"/><circle r="20" fill="url(#edge)" stroke="#f8fafb" stroke-width="2"/><path d="M-4-12H4V-4H12V4H4V12H-4V4H-12V-4H-4Z" fill="#69737b" stroke="#30383e" stroke-width="1.8" stroke-linejoin="round"/></g>
    <g id="panel">
