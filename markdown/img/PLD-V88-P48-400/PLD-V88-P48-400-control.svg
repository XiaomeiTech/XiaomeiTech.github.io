      .label { fill: #fff; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .leader { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .anchor { stroke: #fff; stroke-width: 2; }
    </style>
