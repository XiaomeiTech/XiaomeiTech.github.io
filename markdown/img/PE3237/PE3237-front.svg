<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="418" viewBox="0 180 1040 418" role="img" aria-labelledby="title description">
  <title id="title">PE3237 小车控制器正面接口定义</title>
  <desc id="description">透明背景，保留设备和接口引线。X1 P1 为 PROFINET 网口，RJ45 左灯为绿色 LINK，右灯为琥珀色 TX/RX；四个状态灯从上到下为 COM、PN、MAINT、ERROR；电源端子从左到右为 P24、N24、PE。</desc>
  <defs>
    <linearGradient id="aluminum" x2="0" y2="1">
      <stop stop-color="#f5f6f7"/>
      <stop offset=".42" stop-color="#e4e7e9"/>
      <stop offset="1" stop-color="#cbd0d4"/>
    </linearGradient>
    <linearGradient id="edge" x2="0" y2="1">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#afb6bc"/>
    </linearGradient>
    <linearGradient id="terminal" x2="1" y2="0">
      <stop stop-color="#e4e8eb"/>
      <stop offset=".5" stop-color="#c1c8ce"/>
      <stop offset="1" stop-color="#a6afb6"/>
    </linearGradient>
    <pattern id="hatching" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M-2 2 2-2M0 7 7 0M5 9 9 5" fill="none" stroke="#66717a" stroke-opacity=".12" stroke-width=".8"/>
    </pattern>
    <g id="screw">
      <circle r="25" fill="#b7bec3" stroke="#30383e" stroke-width="2.5"/>
      <circle r="21" fill="url(#edge)" stroke="#f8fafb" stroke-width="2"/>
      <path d="M-4-13H4V-4H13V4H4V13H-4V4H-13V-4H-4Z" fill="#69737b" stroke="#30383e" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <!-- Reusable aluminum faceplate, including the extrusion feet. -->
    <g id="panel">
      <path d="M76 240 23 259Q16 262 16 269V279H1024V269Q1024 262 1017 259L964 240Z" fill="url(#edge)" stroke="#30383e" stroke-width="3" stroke-linejoin="round"/>
      <path d="M19 269H1021" stroke="#fff" stroke-width="2"/>
      <ellipse cx="48" cy="263" rx="14" ry="4.5" fill="#818b94" stroke="#30383e" stroke-width="1.5"/>
      <ellipse cx="992" cy="263" rx="14" ry="4.5" fill="#818b94" stroke="#30383e" stroke-width="1.5"/>
      <rect x="74" width="892" height="280" rx="30" fill="url(#edge)" stroke="#30383e" stroke-width="3"/>
      <rect x="81" y="7" width="878" height="266" rx="24" fill="url(#aluminum)" stroke="#65717a" stroke-width="1.5"/>
      <rect x="84" y="10" width="872" height="260" rx="22" fill="url(#hatching)"/>
      <path d="M100 12H940M88 34V245" fill="none" stroke="#fff" stroke-width="2"/>
      <use href="#screw" x="113" y="37"/>
      <use href="#screw" x="927" y="37"/>
      <use href="#screw" x="113" y="243"/>
      <use href="#screw" x="927" y="243"/>
    </g>
    <!-- One spring-clamp terminal, 58 px pitch. -->
    <g id="terminal-position">
      <rect width="58" height="138" fill="url(#terminal)" stroke="#68747d" stroke-width="1.5"/>
      <path d="M3 134V3H55" fill="none" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="29" cy="25" r="10" fill="#28323a" stroke="#e6ebee" stroke-width="2"/>
      <rect x="10" y="49" width="38" height="25" rx="2" fill="#f1f3f5" stroke="#66727b" stroke-width="1.5"/>
      <rect x="16" y="55" width="26" height="12" fill="#9da8b0" stroke="#414d56" stroke-width="1.5"/>
      <circle cx="29" cy="105" r="18" fill="#3b454d" stroke="#e0e5e8" stroke-width="2"/>
      <circle cx="29" cy="105" r="12" fill="#121a20"/>
    </g>
    <g id="led">
      <circle r="14" fill="#26332c" stroke="#23312b" stroke-width="2"/>
      <circle r="10.5" fill="currentColor" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
      <circle cx="-3.5" cy="-3.5" r="3" fill="#fff" opacity=".85"/>
    </g>
    <style>
      text { font-family: 'HarmonyOS Sans SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; }
      .label { fill: #fff; font-size: 24px; font-weight: 700; text-anchor: middle; }
      .leader { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .anchor { stroke: #fff; stroke-width: 2; }
    </style>
  </defs>
  <g id="front">
    <use href="#panel" y="268"/>

    <g id="rj45">
      <rect x="176" y="337" width="178" height="164" rx="3" fill="url(#edge)" stroke="#30383e" stroke-width="3"/>
      <path d="M182 343H348L334 358H197Z" fill="#fff" stroke="#7b8790" stroke-width="1.5"/>
      <path d="M182 343 197 358V480L182 494Z" fill="#aeb7bf"/>
      <path d="M197 358H334V475H308V491H223V475H197Z" fill="#172129" stroke="#30383e" stroke-width="3"/>
      <path d="M205 379H326M205 394H326M205 409H326" stroke="#3c4851" stroke-width="4"/>
      <path d="M216 360V370M230 360V370M244 360V370M258 360V370M272 360V370M286 360V370M300 360V370M314 360V370" stroke="#9ba4a9" stroke-width="3"/>
      <path d="M247 491V476H284V491" fill="#323e47" stroke="#69747b" stroke-width="1.5"/>
      <rect x="193" y="465" width="28" height="18" rx="2" fill="#3c9c26" stroke="#30383e" stroke-width="2"/>
      <rect x="309" y="465" width="28" height="18" rx="2" fill="#d08c12" stroke="#30383e" stroke-width="2"/>
      <path d="M198 472H216" stroke="#8aee54" stroke-width="5"/>
      <path d="M314 472H332" stroke="#ffd46b" stroke-width="5"/>
      <path class="leader" d="M207 483V562" stroke="#278d23"/>
      <path class="leader" d="M323 483V562" stroke="#b97700"/>
      <rect x="163" y="562" width="88" height="28" rx="4" fill="#278d23"/>
      <rect x="272" y="562" width="102" height="28" rx="4" fill="#b97700"/>
      <text class="label" x="207" y="583" style="font-size: 19px">LINK</text>
      <text class="label" x="323" y="583" style="font-size: 19px">TX/RX</text>
    </g>

    <g id="status-leds">
      <use href="#led" x="650" y="366" color="#60c72b"/>
      <use href="#led" x="650" y="401" color="#60c72b"/>
      <use href="#led" x="650" y="436" color="#f5b71b"/>
      <use href="#led" x="650" y="471" color="#ee4744"/>
      <g fill="#278d23">
        <rect x="464" y="349" width="112" height="31" rx="5"/>
        <rect x="464" y="384" width="112" height="31" rx="5"/>
      </g>
      <rect x="464" y="419" width="112" height="31" rx="5" fill="#b97700"/>
      <rect x="464" y="454" width="112" height="31" rx="5" fill="#d73535"/>
      <g class="label" style="font-size: 21px">
        <text x="520" y="372">COM</text>
        <text x="520" y="407">PN</text>
        <text x="520" y="442">MAINT</text>
        <text x="520" y="477">ERROR</text>
      </g>
      <g class="leader">
        <path d="M576 365H612L635 366M576 400H612L635 401" stroke="#278d23"/>
        <path d="M576 435H612L635 436" stroke="#b97700"/>
        <path d="M576 470H612L635 471" stroke="#d73535"/>
      </g>
    </g>

    <rect x="694" y="343" width="184" height="148" rx="2" fill="#414e57" stroke="#30383e" stroke-width="3"/>
    <use href="#terminal-position" x="699" y="348"/>
    <use href="#terminal-position" x="757" y="348"/>
    <use href="#terminal-position" x="815" y="348"/>

    <g class="leader">
      <path d="M265 238V351" stroke="#008fb8"/>
      <path d="M706 238V255L728 373" stroke="#d73535"/>
      <path d="M792 238V255L786 373" stroke="#0875bc"/>
      <path d="M878 238V255L844 373" stroke="#278d23"/>
    </g>
    <g class="anchor">
      <circle cx="265" cy="351" r="6" fill="#008fb8"/>
      <circle cx="728" cy="373" r="6" fill="#d73535"/>
      <circle cx="786" cy="373" r="6" fill="#0875bc"/>
      <circle cx="844" cy="373" r="6" fill="#278d23"/>
    </g>
    <rect x="182" y="190" width="166" height="48" rx="6" fill="#008fb8"/>
    <rect x="668" y="194" width="76" height="44" rx="6" fill="#d73535"/>
    <rect x="754" y="194" width="76" height="44" rx="6" fill="#0875bc"/>
    <rect x="840" y="194" width="76" height="44" rx="6" fill="#278d23"/>
    <g class="label">
      <text x="265" y="223" style="font-size: 29px">X1 P1</text>
      <text x="706" y="224">P24</text>
      <text x="792" y="224">N24</text>
      <text x="878" y="224">PE</text>
    </g>
  </g>
</svg>
